      description: Only configured auth origin; pre-login Origin/CSRF required. Uniform 202 for existing/unknown username/contact,
        directory/blocked/privileged target, disabled delivery and target budget denial; no delivery ID/account/contact
        metadata. Source/global ceilings may return uniform 429 independently of account existence. Recipient is resolved
        only from matching verified encrypted contact, never directly from input. Ordinary local reset requires the
        link plus current TOTP. Privileged reset requires a separately approved authenticated plan and is not authorized
        by this anonymous request. Issuance never raises human principal/password floors or revokes victim sessions.
      responses:
        '202':
          description: Uniform request accepted response with no body; no claim that a message was sent or delivered.
        default:
          description: Redacted error; no principal/contact existence, credentials, tokens or SMTP/provider diagnostics.
          content:
