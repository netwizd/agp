    WafEffectiveField:
      type: object
      properties:
        routeId:
          $ref: '#/components/schemas/Id'
        field:
          type: string
          enum:
          - wafMode
          - policyRevisionId
          - paranoiaLevel
          - inboundAnomalyThreshold
          - outboundAnomalyThreshold
          - exceptionCount
        effectiveValue:
          oneOf:
          - type: object
            properties:
              kind:
                const: mode
              value:
                type: string
                enum:
                - 'off'
                - detection
                - blocking
            required:
            - kind
            - value
            additionalProperties: false
          - type: object
            properties:
              kind:
                const: policy_revision
              value:
                $ref: '#/components/schemas/Id'
            required:
            - kind
            - value
            additionalProperties: false
          - type: object
            properties:
              kind:
                const: integer
              value:
                type: integer
                minimum: 0
                maximum: 100
            required:
            - kind
            - value
            additionalProperties: false
        source:
          type: object
          properties:
            kind:
              type: string
              enum:
              - gateway
              - zone
              - local_policy
              - profile
              - security_floor
              - default
              - route
            id:
              anyOf:
              - $ref: '#/components/schemas/Id'
              - type: 'null'
            redacted:
              type: boolean
          required:
          - kind
          - id
          - redacted
          additionalProperties: false
        locked:
          type: boolean
        lockedByProfileRevisionId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - routeId
      - field
      - effectiveValue
      - source
      - locked
      - lockedByProfileRevisionId
      additionalProperties: false
      allOf:
      - if:
          properties:
            field:
              const: wafMode
        then:
          properties:
            effectiveValue:
              properties:
                kind:
                  const: mode
      - if:
          properties:
            field:
              const: policyRevisionId
        then:
          properties:
            effectiveValue:
              properties:
                kind:
                  const: policy_revision
      - if:
          properties:
            field:
              const: paranoiaLevel
        then:
          properties:
            effectiveValue:
              properties:
                kind:
                  const: integer
                value:
                  type: integer
                  minimum: 1
                  maximum: 4
      - if:
          properties:
            field:
              const: inboundAnomalyThreshold
        then:
          properties:
            effectiveValue:
              properties:
                kind:
                  const: integer
                value:
                  type: integer
                  minimum: 1
                  maximum: 100
      - if:
          properties:
            field:
              const: outboundAnomalyThreshold
        then:
          properties:
            effectiveValue:
              properties:
                kind:
                  const: integer
                value:
                  type: integer
                  minimum: 1
                  maximum: 100
      - if:
          properties:
            field:
              const: exceptionCount
        then:
          properties:
            effectiveValue:
              properties:
                kind:
                  const: integer
                value:
                  type: integer
                  minimum: 0
                  maximum: 100
