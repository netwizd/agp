  /agent/v1/execution/baseline-challenges:
    post:
      operationId: createExecutionBaselineChallenge
      summary: Получить одноразовый challenge для проверки текущей базы своего узла
      tags:
      - agent
      security:
      - NodeMTLS: []
      description: AS-IS opt-in. Requires AGP_EXECUTION_CONFIG and current registered agent mTLS identity.
        The challenge binds the installation anchor and current authority epoch; its lifetime is at most two minutes.
        It cannot initialize a helper ledger or authorize execution. Browser cookies, Origin and query parameters are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineChallengeRequest'
      responses:
        '201':
          description: Fresh single-use challenge for the authenticated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineChallenge'
        default:
          description: Safe machine error; disabled execution returns 503.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /agent/v1/execution/baselines:
    post:
      operationId: captureExecutionBaseline
      summary: Принять подписанное наблюдение root helper о текущей базе
      tags:
      - agent
      security:
      - NodeMTLS: []
      description: AS-IS opt-in; at most 64 KiB. Checks the unused live challenge, installed root receipt key,
        exact anchor, boot/inventory binding and monotonic state. A signature alone is insufficient.
        It cannot reset accepted counters, adopt an unknown tree, qualify a bundle or authorize apply.
        The initial capture must equal the installed baseline; divergent state freezes the source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineCapture'
      responses:
        '204':
          description: Capture accepted; empty body.
        default:
          description: Safe machine error; disabled execution returns 503.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    BaselineChallengeRequest:
      type: object
      properties: {}
      additionalProperties: false
    ExecutionHeadPin:
      type: object
      properties:
        authorityId:
          $ref: '#/components/schemas/Id'
        authorityEpoch:
          allOf:
          - $ref: '#/components/schemas/UInt63'
          - not:
              const: '0'
        sequence:
          $ref: '#/components/schemas/UInt63'
        digest:
          type: string
          pattern: ^(sha256:[0-9a-f]{64})?$
          maxLength: 71
      required:
      - authorityId
      - authorityEpoch
      - sequence
      - digest
      additionalProperties: false
      allOf:
      - if:
          properties:
            sequence:
              const: '0'
        then:
          properties:
            digest:
              const: ''
        else:
          properties:
            digest:
              $ref: '#/components/schemas/Digest'
    BaselineChallenge:
      type: object
      description: Exact unused challenge and canonical UTC window (issuedAt < expiresAt, at most two minutes)
        must be verified by the service; schema validation supplies no authority.
      properties:
        apiVersion:
          const: agp.helper-baseline-challenge/v1alpha1
        id:
          $ref: '#/components/schemas/Id'
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
          minLength: 43
          maxLength: 43
        nodeId:
          $ref: '#/components/schemas/Id'
        anchorDigest:
          $ref: '#/components/schemas/Digest'
        authorityId:
          $ref: '#/components/schemas/Id'
        authorityEpoch:
          allOf:
          - $ref: '#/components/schemas/UInt63'
          - not:
              const: '0'
        issuedAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - apiVersion
      - id
      - challenge
      - nodeId
      - anchorDigest
      - authorityId
      - authorityEpoch
      - issuedAt
      - expiresAt
      additionalProperties: false
    BaselineCapture:
      type: object
      description: Signed read-only observation of an existing verified helper ledger, domain
        AGP-HELPER-BASELINE-CAPTURE-v1. The receiver also checks the live one-use challenge,
        signature, counters, head, boot and exact baseline/source binding. Fixture signatures are synthetic.
      properties:
        apiVersion:
          const: agp.helper-baseline-capture/v1alpha1
        purpose:
          const: verified_baseline_capture
        query:
          $ref: '#/components/schemas/BaselineChallenge'
        active:
          $ref: '#/components/schemas/ExecutionGeneration'
        highWater:
          $ref: '#/components/schemas/UInt63'
        receiptSequence:
          $ref: '#/components/schemas/UInt63'
        authorityEpoch:
          allOf:
          - $ref: '#/components/schemas/UInt63'
          - not:
              const: '0'
        writerEpoch:
          allOf:
          - $ref: '#/components/schemas/UInt63'
          - not:
              const: '0'
        minimumDenySequence:
          $ref: '#/components/schemas/UInt63'
        head:
          $ref: '#/components/schemas/ExecutionHeadPin'
        bootDigest:
          $ref: '#/components/schemas/Digest'
        recordedAt:
          $ref: '#/components/schemas/UtcTime'
        keyId:
          $ref: '#/components/schemas/Id'
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]{85}[AQgw]$
          minLength: 86
          maxLength: 86
      required:
      - apiVersion
      - purpose
      - query
      - active
      - highWater
      - receiptSequence
      - authorityEpoch
      - writerEpoch
      - minimumDenySequence
      - head
      - bootDigest
      - recordedAt
      - keyId
      - signature
      additionalProperties: false
    ExecutionGeneration:
      type: object
      properties:
        baseline:
          type: object
          properties:
            revisionId:
              $ref: '#/components/schemas/Id'
            bundleDigest:
              $ref: '#/components/schemas/Digest'
            nodeDeploymentSequence:
              $ref: '#/components/schemas/UInt63'
          required:
          - revisionId
          - bundleDigest
          - nodeDeploymentSequence
          additionalProperties: false
        generationId:
          $ref: '#/components/schemas/Id'
        treeDigest:
          $ref: '#/components/schemas/Digest'
      required:
      - baseline
      - generationId
      - treeDigest
      additionalProperties: false
    ExecutionReceipt:
      type: object
      properties:
        apiVersion:
          const: agp.helper-execution-receipt/v1alpha1
        purpose:
          const: local_execution_outcome
        receiptId:
          $ref: '#/components/schemas/Id'
        receiptSequence:
          $ref: '#/components/schemas/UInt63'
        nodeId:
          $ref: '#/components/schemas/Id'
        taskId:
          $ref: '#/components/schemas/Id'
        requestDigest:
          $ref: '#/components/schemas/Digest'
        nodeDeploymentSequence:
          $ref: '#/components/schemas/UInt63'
        active:
          $ref: '#/components/schemas/ExecutionGeneration'
        state:
          enum:
          - succeeded
          - failed
          - recovered
          - recovery_required
        recoveryRequired:
          type: boolean
        recordedAt:
          $ref: '#/components/schemas/UtcTime'
        keyId:
          $ref: '#/components/schemas/Id'
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]{86}$
          minLength: 86
          maxLength: 86
      required:
      - apiVersion
      - purpose
      - receiptId
      - receiptSequence
      - nodeId
      - taskId
      - requestDigest
      - nodeDeploymentSequence
      - active
      - state
      - recoveryRequired
      - recordedAt
      - keyId
      - signature
      additionalProperties: false
    ExecutionCreate:
      type: object
      properties:
        siteId:
          $ref: '#/components/schemas/Id'
        revisionId:
          $ref: '#/components/schemas/Id'
        nodeIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          maxItems: 500
          uniqueItems: true
        rolloutPolicy:
          $ref: ../schemas/shared.schema.json#/$defs/RolloutPolicy
        reason:
          $ref: ../schemas/shared.schema.json#/$defs/Reason
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - siteId
      - revisionId
      - nodeIds
      - rolloutPolicy
      - reason
      - expiresAt
      additionalProperties: false
      description: Current implementation accepts sequential maxParallel=1/maxUnavailable=1/failureAction=pause only;
        unsupported policy=422. Exact source snapshot, actual verified baseline and qualified native bundle are required.
        Maximum expiry 30 minutes.
    ExecutionApproval:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        planId:
          $ref: '#/components/schemas/Id'
        planDigest:
          $ref: '#/components/schemas/Digest'
        approvedBy:
          $ref: '#/components/schemas/Id'
        approvalDigest:
          $ref: '#/components/schemas/Digest'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
        mfaAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - planId
      - planDigest
      - approvedBy
      - approvalDigest
      - createdAt
      - expiresAt
      - mfaAt
      additionalProperties: false
    ExecutionAccess:
      type: object
      properties:
        read:
          type: boolean
        approve:
          type: boolean
        dispatch:
          type: boolean
        cancel:
          type: boolean
        rollback:
          type: boolean
      required:
      - read
      - approve
      - dispatch
      - cancel
      - rollback
      additionalProperties: false
    ExecutionTaskView:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nodeId:
          $ref: '#/components/schemas/Id'
        nodeDeploymentSequence:
          $ref: '#/components/schemas/UInt63'
        state:
          enum:
          - dispatched
          - succeeded
          - failed
          - recovered
          - recovery_required
        receipt:
          $ref: '#/components/schemas/ExecutionReceipt'
      required:
      - id
      - nodeId
      - nodeDeploymentSequence
      - state
      additionalProperties: false
    ExecutionPlanView:
      type: object
      properties:
        plan:
          $ref: ../schemas/plan.schema.json
        state:
          enum:
          - validated
          - approved
          - running
          - succeeded
          - failed
          - cancelled
          - recovery_required
        parentPlanId:
          $ref: '#/components/schemas/Id'
        approval:
          $ref: '#/components/schemas/ExecutionApproval'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionTaskView'
          minItems: 0
          maxItems: 500
        current:
          type: boolean
        access:
          $ref: '#/components/schemas/ExecutionAccess'
      required:
      - plan
      - state
      - tasks
      - current
      additionalProperties: false
    ExecutionDigestDecision:
      type: object
      properties:
        planDigest:
          $ref: '#/components/schemas/Digest'
      required:
      - planDigest
      additionalProperties: false
    ExecutionDispatch:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/Id'
              nodeId:
                $ref: '#/components/schemas/Id'
              nodeDeploymentSequence:
                $ref: '#/components/schemas/UInt63'
            required:
            - id
            - nodeId
            - nodeDeploymentSequence
            additionalProperties: false
          minItems: 1
          maxItems: 1
      required:
      - items
      additionalProperties: false
      description: Acknowledges task dispatch only. GET plan and signed helper receipts supply execution outcomes. A
        lost response requires exact same-key retry; it never permits another native effect.
    ExecutionStartQuery:
      type: object
      properties:
        apiVersion:
          const: agp.helper-start/v1alpha1
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
          minLength: 16
          maxLength: 128
        requestDigest:
          $ref: '#/components/schemas/Digest'
        installationDigest:
          $ref: '#/components/schemas/Digest'
        head:
          $ref: '#/components/schemas/ExecutionHeadPin'
      required:
      - apiVersion
      - challenge
      - requestDigest
      - installationDigest
      - head
      additionalProperties: false
    ExecutionStartProof:
      type: object
      properties:
        query:
          $ref: '#/components/schemas/ExecutionStartQuery'
        keyId:
          $ref: '#/components/schemas/Id'
        writerEpoch:
          $ref: '#/components/schemas/UInt63'
        checkedAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]{86}$
          minLength: 86
          maxLength: 86
      required:
      - query
      - keyId
      - writerEpoch
      - checkedAt
      - expiresAt
      - signature
      additionalProperties: false
    ExecutionPermit:
      type: object
      properties:
        apiVersion:
          const: agp.helper-permit/v1alpha1
        keyId:
          $ref: '#/components/schemas/Id'
        taskDigest:
          $ref: '#/components/schemas/Digest'
        installationDigest:
          $ref: '#/components/schemas/Digest'
        identityDigest:
          $ref: '#/components/schemas/Digest'
        ownershipDigest:
          $ref: '#/components/schemas/Digest'
        componentProfileDigest:
          $ref: '#/components/schemas/Digest'
        releaseManifestDigest:
          $ref: '#/components/schemas/Digest'
        tupleDigest:
          $ref: '#/components/schemas/Digest'
        compilerDigest:
          $ref: '#/components/schemas/Digest'
        approval:
          type: object
          properties:
            siteId:
              $ref: '#/components/schemas/Id'
            createdBy:
              $ref: '#/components/schemas/Id'
            approvedBy:
              $ref: '#/components/schemas/Id'
            approvalDigest:
              $ref: '#/components/schemas/Digest'
          required:
          - siteId
          - createdBy
          - approvedBy
          - approvalDigest
          additionalProperties: false
        recovery:
          type: object
          properties:
            baseRevisionId:
              $ref: '#/components/schemas/Id'
            baseBundleDigest:
              $ref: '#/components/schemas/Digest'
            ownershipDigest:
              $ref: '#/components/schemas/Digest'
            minimumDenySequence:
              $ref: '#/components/schemas/UInt63'
          required:
          - baseRevisionId
          - baseBundleDigest
          - ownershipDigest
          - minimumDenySequence
          additionalProperties: false
        signature:
          type: string
          pattern: ^[A-Za-z0-9_-]{86}$
          minLength: 86
          maxLength: 86
      required:
      - apiVersion
      - keyId
      - taskDigest
      - installationDigest
      - identityDigest
      - ownershipDigest
      - componentProfileDigest
      - releaseManifestDigest
      - tupleDigest
      - compilerDigest
      - approval
      - recovery
      - signature
      additionalProperties: false
    ExecutionRequest:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/AgentTask'
        permit:
          $ref: '#/components/schemas/ExecutionPermit'
        signedPlan:
          $ref: '#/components/schemas/SignedPlan'
      required:
      - task
      - permit
      - signedPlan
      additionalProperties: false
    ExecutionPending:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionRequest'
          minItems: 0
          maxItems: 1
      required:
      - items
      additionalProperties: false
    NodeIdentityProfile:
      type: object
      properties:
        enabled:
          type: boolean
        supportedRoles:
          type: array
          items:
            const: agent
          minItems: 1
          maxItems: 1
          uniqueItems: true
      required:
      - enabled
      - supportedRoles
      additionalProperties: false
    NodeEnrollmentSubmission:
      type: object
      properties:
        nodeId:
          $ref: '#/components/schemas/Id'
        enrollmentToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          minLength: 43
          maxLength: 43
        csrPem:
          type: string
          minLength: 1
          maxLength: 16384
      required:
      - nodeId
      - enrollmentToken
      - csrPem
      additionalProperties: false
    NodeEnrollmentView:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        enrollmentId:
          $ref: '#/components/schemas/Id'
        nodeId:
          $ref: '#/components/schemas/Id'
        state:
          enum:
          - issued
          - csr_pending
          - approved
          - issued_certificate
          - revoked
        publicKeyDigest:
          oneOf:
          - $ref: '#/components/schemas/Digest'
          - const: ''
        requestDigest:
          oneOf:
          - $ref: '#/components/schemas/Digest'
          - const: ''
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - enrollmentId
      - nodeId
      - state
      - publicKeyDigest
      - requestDigest
      - expiresAt
      additionalProperties: false
    NodeEnrollmentApproval:
      type: object
      properties:
        expectedPublicKeyDigest:
          $ref: '#/components/schemas/Digest'
        requestDigest:
          $ref: '#/components/schemas/Digest'
      required:
      - expectedPublicKeyDigest
      - requestDigest
      additionalProperties: false
    NodeEnrollmentRevocation:
      type: object
      properties: {}
      additionalProperties: false
    NodeIdentityOperation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nodeId:
          $ref: '#/components/schemas/Id'
        kind:
          const: revoke_node
        state:
          const: completed
      required:
      - id
      - nodeId
      - kind
      - state
      additionalProperties: false
    Id:
      $ref: ../schemas/shared.schema.json#/$defs/Id
    UInt63:
      $ref: ../schemas/shared.schema.json#/$defs/UInt63
    Digest:
