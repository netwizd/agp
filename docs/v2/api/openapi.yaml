    SecurityOperation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        family:
          enum:
          - restriction
          - deny_lift
          - grant_role_binding
          - provider_security_change
          - identity_recovery
          - oidc_identity_link
        requestDigest:
          $ref: '#/components/schemas/Digest'
        state:
          enum:
          - pending
          - journaled
          - applied
          - rejected
          - recovery_required
        approvalStatus:
          enum:
          - not_required
          - pending
          - approved
          - rejected
          - expired
        subjectId:
          $ref: '#/components/schemas/Id'
        createdBy:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        providerChange:
          $ref: '#/components/schemas/ProviderSecurityChange'
        oidcLinkChange:
          $ref: '#/components/schemas/OIDCLinkChange'
        recoveryRequest:
          $ref: '#/components/schemas/IdentityRecoveryIntent'
        roleGrantRequest:
          $ref: '#/components/schemas/RoleGrantIntent'
        roleBindingRevokeRequest:
          $ref: '#/components/schemas/RoleBindingRevokeRequest'
      required:
      - id
      - family
      - requestDigest
      - state
      - approvalStatus
      - subjectId
      - createdBy
      - createdAt
      additionalProperties: false
      allOf:
      - if:
          properties:
            family:
              const: provider_security_change
        then:
          required:
          - providerChange
        else:
          not:
            required:
            - providerChange
      - if:
          properties:
            family:
              const: oidc_identity_link
        then:
          required:
          - oidcLinkChange
        else:
          not:
            required:
            - oidcLinkChange
      - if:
          properties:
            family:
              const: identity_recovery
        then:
          required:
          - recoveryRequest
        else:
          not:
            required:
            - recoveryRequest
      - if:
          properties:
            family:
              const: grant_role_binding
        then:
          required:
          - roleGrantRequest
        else:
          not:
            required:
            - roleGrantRequest
      - if:
          required:
          - roleBindingRevokeRequest
        then:
          properties:
            family:
              const: restriction
