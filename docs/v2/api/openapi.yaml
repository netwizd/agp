      operationId: startOIDCAuthorization
      summary: Начать один browser/flow-bound authorization code request
      tags:
      - identity_flow
      security:
      - PendingFlow: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - *oidcpaths002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCAuthorizationRequest'
      description: Exact same Origin and flow CSRF/binding required. Only pending_primary login/step_up. Purpose and
        provider-specific redirect derive from listener/flow; body cannot select clientId, redirect, scopes, claims
        or target principal. Step-up must resolve to its source principal. At most one outstanding state per flow
        and three authorizations per flow. Explicit new authorization revokes its predecessor; no hidden retry.
      responses:
        '201':
          description: CSPRNG 256-bit state/nonce/verifier, S256; state only hash in DB, nonce/verifier AEAD under
            separate protected key. State expires no later than flow (5 min).
          content:
