      description: Targets the exact binding incarnation and If-Match revision. Returns an accepted restriction
        operation whose GET exposes roleBindingRevokeRequest. Journal replay preserves its revocation tombstone
        even if the positive binding row is absent; revoked IDs are never reused. No second approval delays revoke.
        AcceptedOperation.resourceId identifies the exact revoked bindingId; SecurityOperation.subjectId identifies the target principalId.
