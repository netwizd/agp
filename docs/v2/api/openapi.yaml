                  $ref: '#/components/schemas/WafPolicyDerivation'
              required:
              - content
              additionalProperties: false
      description: Optional derivation is a closed envelope outside WafPolicy.spec. First derive or rebase requires
        current config.edit on exact Gateway/Site and published same-Site base/zone/previous versions. Server computes
