        activate accepts only a reserved initial invite; recover accepts only reset_password authorization after required
        TOTP or supervised ticket. No caller-selected principal/action. Password is staged, not active. Initial setup
        proceeds to email_code with mandatory 8-digit invite_confirmation on the pinned contact/version. Only successful
        OTP consume permits staged totp_enrollment, then state=ready/nextStep=complete; direct password-to-TOTP transition
        is forbidden. Reset proceeds to completion after its required proof. Never enrolls/replaces
        MFA under a reset_password capability. No session/handoff, hash or token response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
