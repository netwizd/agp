openapi: 3.1.1
info:
  title: AGP v2 engineering contract
  version: 0.2.0-target
  description: TARGET contract with documented S0/S1, native base-WAF, inventory/trusted-zone, approved agent identity, local syntax, non-executing planning-review and default-disabled execution foundation coverage (../development.md).
    Separate management/enrollment/agent/edge_auth listeners and role authorization required. JSON schemas are shared
    with file import. Browser login, first-party handoff redirects, upload transport and checkpoint-service APIs
    are further specified in ../protocols.md; no generic shell or raw JSON command endpoint exists.
servers:
- url: https://management.example.net
  description: Installation profile placeholder; agent/auth operations use their role listener.
tags:
- name: management
- name: agent
- name: enrollment
- name: edge_auth
- name: identity_flow
paths:
  /api/v2/me:
    get:
      operationId: getMe
      summary: Текущий пользователь и эффективные права
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        default: &id001
          description: Безопасная машинная ошибка; message не содержит секретов.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v2/sites:
    get:
      operationId: listSites
      summary: Площадки в доступном scope
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                    minItems: 0
                    maxItems: 200
                  nextCursor:
                    type: string
                    minLength: 0
                    maxLength: 1024
                required:
                - items
                additionalProperties: false
        default: *id001
      parameters:
      - &id002
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - &id003
        name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      x-agp-permission: nodes.read
    post:
      operationId: createSite
      summary: Создать площадку
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: nodes.enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
              - id
              - name
              additionalProperties: false
  /api/v2/sites/{id}:
    patch:
      operationId: updateSite
      summary: Обновить площадку с CAS
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: nodes.enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
              - name
              additionalProperties: false
  /api/v2/nodes:
    get:
      x-agp-implementation: AS-IS admin-only agent-role pilot; TARGET scoped nodes permissions and EdgeAuth issuance remain unimplemented.
      operationId: listNodes
      summary: Admin-only declared nodes; identity отдельна от health
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                    minItems: 0
                    maxItems: 200
                  nextCursor:
                    type: string
                    minLength: 0
                    maxLength: 1024
                required:
                - items
                additionalProperties: false
        default: *id001
      parameters:
      - *id002
      - *id003
      x-agp-permission: nodes.read
    post:
      x-agp-implementation: AS-IS admin-only agent-role pilot; TARGET scoped nodes permissions and EdgeAuth issuance remain unimplemented.
      operationId: createNode
      x-agp-fresh-mfa-required: true
      summary: Зарезервировать узел перед enrollment
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        default: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: nodes.enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                siteId:
                  $ref: '#/components/schemas/Id'
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                labels:
                  $ref: ../schemas/shared.schema.json#/$defs/Labels
              required:
              - id
              - siteId
              - name
              - labels
              additionalProperties: false
  /api/v2/nodes/{id}:
    get:
      x-agp-implementation: AS-IS admin-only agent-role pilot; TARGET scoped nodes permissions and EdgeAuth issuance remain unimplemented.
      operationId: getNode
      summary: Карточка узла
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
          headers:
            ETag:
              description: Quoted mutable resource revision, where applicable
              schema:
                type: string
                minLength: 1
                maxLength: 64
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      x-agp-permission: nodes.read
  /api/v2/nodes/{id}/enrollments:
    post:
      x-agp-implementation: AS-IS admin-only agent-role pilot; TARGET scoped nodes permissions and EdgeAuth issuance remain unimplemented.
      operationId: createEnrollment
      description: AS-IS role=agent only; edge_auth is retained TARGET. 256 random bits, hash-only at rest, first response only. ttlSeconds omitted or zero selects 600 seconds; explicit nonzero values are 60..900.
      summary: Выдать одноразовый enrollment token, показать один раз
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '201':
          description: Первичная выдача tokenAvailable=true; replay key возвращает false без token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollmentId:
                    $ref: '#/components/schemas/Id'
                  token:
                    type: string
                    minLength: 43
                    maxLength: 128
                  expiresAt:
                    $ref: '#/components/schemas/UtcTime'
                  tokenAvailable:
                    type: boolean
                required:
                - enrollmentId
                - expiresAt
                - tokenAvailable
                additionalProperties: false
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: nodes.enroll
      x-agp-fresh-mfa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                  - agent
                  - edge_auth
                ttlSeconds:
                  type: integer
                  minimum: 0
                  maximum: 900
                  default: 600
                  description: AS-IS zero/omitted means default; 1..59 is rejected.
              required:
              - role
              additionalProperties: false
  /api/v2/nodes/{id}/revocations:
    post:
      x-agp-implementation: AS-IS admin-only agent-role pilot; TARGET scoped nodes permissions and EdgeAuth issuance remain unimplemented.
      operationId: revokeNode
      summary: Отозвать node identity через security journal
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: nodes.revoke
      x-agp-fresh-mfa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  $ref: ../schemas/shared.schema.json#/$defs/Reason
              required:
              - reason
              additionalProperties: false
  /api/v2/config/revisions:
    post:
      operationId: createRevision
      summary: Создать неизменяемый draft из общей модели
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        default: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: config.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  baseRevisionId:
                    $ref: '#/components/schemas/Id'
                  content:
                    $ref: '#/components/schemas/Configuration'
                required:
                - content
                additionalProperties: false
              - type: object
                properties:
                  baseRevisionId:
                    $ref: '#/components/schemas/Id'
                  gatewayChange:
                    type: object
                    properties:
                      gatewayId:
                        $ref: '#/components/schemas/Id'
                      content:
                        $ref: '#/components/schemas/Gateway'
                    required:
                    - gatewayId
                    - content
                    additionalProperties: false
                required:
                - baseRevisionId
                - gatewayChange
                additionalProperties: false
              - type: object
                properties:
                  baseRevisionId:
                    $ref: '#/components/schemas/Id'
                  resourceChange:
                    $ref: '#/components/schemas/ResourceChange'
                required:
                - baseRevisionId
                - resourceChange
                additionalProperties: false
              - type: object
                properties:
                  wafZoneChange:
                    $ref: '#/components/schemas/WafZoneChangeRequest'
                required:
                - wafZoneChange
                additionalProperties: false
      description: Global Configuration snapshot. Full content requires global config.edit; gatewayChange is a scoped
        upsert merged server-side into the complete base snapshot under config_head CAS. All other gateways/profile
        assignments are preserved. Response scoped view must not leak other gateways; never hash a redacted view.
        An exclusive resourceChange replaces one existing sealed resource route, preserving all other placements.
        Both old and candidate placement, indirect routing winners and cross-Gateway receiving-node effects are
        checked with current grants; resource grants never authorize a whole Gateway. Assigned WAF security changes
        still require trusted zone resolution. The response contains resourceView/resourceAccess only.
        The exclusive wafZoneChange intent materializes the same trusted frozen change as /waf/zone-changes and
        returns the immutable result revision directly; its baseRevisionId is nested in that intent. Site-scoped
        callers receive metadata without full content. It never applies the revision to nodes.
      x-agp-implementation: 'S1b: full content requires global config.edit. Site-scoped gatewayChange updates only
        an existing Gateway with bootstrapped immutable ownership, preserves Site/node selector/ownership/component
        profile/TLS, merges server-side under global-head CAS and returns gatewayView without full content. Existing
        admin compatibility grants global read/edit only.'
    get:
      operationId: listRevisions
      summary: Список доступных объектов с server-side scope/pagination
      tags:
      - management
      security:
      - ManagementSession: []
      x-agp-permission: config.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Revision'
                    maxItems: 200
                  nextCursor:
                    type: string
                    minLength: 0
                    maxLength: 1024
                required:
                - items
                additionalProperties: false
        default: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      x-agp-implementation: 'S1b: list requires global config.read; node/group/resource scopes remain TARGET.'
  /api/v2/config/revisions/{id}:
    get:
      operationId: getRevision
      summary: Прочитать canonical revision
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
          headers:
            ETag:
              description: Quoted mutable resource revision, where applicable
              schema:
                type: string
                minLength: 1
                maxLength: 64
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: gatewayId
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        description: Scoped view only. Full canonical content requires global read; otherwise metadata or this permitted
          gateway view.
      x-agp-permission: config.read
      x-agp-implementation: 'S1b: full content requires global config.read; gatewayId returns an authorized gatewayView
        without full content. contentDigest remains the full immutable snapshot digest, not a hash of the filtered
        view. Scoped Gateway ownership is checked from the immutable DB projection, never from imported catalogs.'
  /api/v2/config/revisions/{id}/validations:
    post:
      operationId: validateRevision
      summary: Schema + semantic + compatibility validation
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
          headers:
            Location:
              description: Relative statusUrl of the saved validation report.
              schema:
                type: string
                minLength: 1
                maxLength: 512
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: config.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
      description: ' S1 pilot returns the existing AcceptedOperation: resourceId is the report ID, statusUrl and
        Location point to the immutable report; GET /api/v2/operations/{id} returns the existing Operation. Current
        global is_admin only; operation succeeded does not mean deployable.'
  /api/v2/deployment-plans:
    post:
      operationId: createPlan
      summary: Разрешить targets и скомпилировать immutable plan
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        default: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: config.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionId:
                  $ref: '#/components/schemas/Id'
                targetNodeIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/Id'
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                rolloutPolicy:
                  $ref: ../schemas/shared.schema.json#/$defs/RolloutPolicy
                reason:
                  $ref: ../schemas/shared.schema.json#/$defs/Reason
              required:
              - revisionId
              - targetNodeIds
              - rolloutPolicy
              - reason
              additionalProperties: false
    get:
      operationId: listPlans
      summary: Список доступных объектов с server-side scope/pagination
      tags:
      - management
      security:
      - ManagementSession: []
      x-agp-permission: config.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanView'
                    maxItems: 200
                  nextCursor:
                    type: string
                    minLength: 0
                    maxLength: 1024
                required:
                - items
                additionalProperties: false
        default: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
  /api/v2/deployment-plans/{id}:
    get:
      operationId: getPlan
      summary: План с фиксированными targets и digest
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
          headers:
            ETag:
              description: Quoted mutable resource revision, where applicable
              schema:
                type: string
                minLength: 1
                maxLength: 64
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      x-agp-permission: config.read
  /api/v2/deployment-plans/{id}/approvals:
    post:
      operationId: approvePlan
      summary: Подтвердить точный digest плана
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalId:
                    $ref: '#/components/schemas/Id'
                  planId:
                    $ref: '#/components/schemas/Id'
                  planDigest:
                    $ref: '#/components/schemas/Digest'
                  approvedBy:
                    $ref: '#/components/schemas/Id'
                  approvedAt:
                    $ref: '#/components/schemas/UtcTime'
                required:
                - approvalId
                - planId
                - planDigest
                - approvedBy
                - approvedAt
                additionalProperties: false
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: config.approve
      x-agp-fresh-mfa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planDigest:
                  $ref: '#/components/schemas/Digest'
                reason:
                  $ref: ../schemas/shared.schema.json#/$defs/Reason
              required:
              - planDigest
              - reason
              additionalProperties: false
  /api/v2/rollouts:
    post:
      operationId: startRollout
      summary: Начать approved plan после повторной проверки прав
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        default: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: rollouts.create
      x-agp-fresh-mfa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  $ref: '#/components/schemas/Id'
                planDigest:
                  $ref: '#/components/schemas/Digest'
              required:
              - planId
              - planDigest
              additionalProperties: false
    get:
      operationId: listRollouts
      summary: Список доступных объектов с server-side scope/pagination
      tags:
      - management
      security:
      - ManagementSession: []
      x-agp-permission: config.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rollout'
                    maxItems: 200
                  nextCursor:
                    type: string
                    minLength: 0
                    maxLength: 1024
                required:
                - items
                additionalProperties: false
        default: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
  /api/v2/rollouts/{id}:
    get:
      operationId: getRollout
      summary: Статус rollout; отсутствие receipt не означает failure
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
          headers:
            ETag:
              description: Quoted mutable resource revision, where applicable
              schema:
                type: string
                minLength: 1
                maxLength: 64
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      x-agp-permission: config.read
  /api/v2/rollouts/{id}/pause:
    post:
      operationId: pauseRollout
      summary: Остановить новый dispatch
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: rollouts.cancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  $ref: ../schemas/shared.schema.json#/$defs/Reason
              required:
              - reason
              additionalProperties: false
  /api/v2/rollouts/{id}/resume:
    post:
      operationId: resumeRollout
      summary: Продолжить после проверки свежести plan
      tags:
      - management
      security:
      - ManagementSession: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRF'
      x-agp-permission: rollouts.create
      x-agp-fresh-mfa-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  $ref: ../schemas/shared.schema.json#/$defs/Reason
              required:
              - reason
              additionalProperties: false
  /api/v2/rollouts/{id}/cancel:
    post:
      operationId: cancelRollout
      summary: Отменить ещё не начатые задания; без implicit rollback
      tags:
      - management
      security:
      - ManagementSession: []
