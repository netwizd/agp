  /auth/v2/oidc/providers/{providerId}/callback:
    get:
      operationId: completeOIDCAuthorization
      summary: Одноразовый server-side OIDC callback без выдачи session
      tags:
      - identity_flow
      security:
      - PendingFlow: []
      parameters:
      - name: providerId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: state
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
      - name: code
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 4096
        description: Exactly one of code or error. Never logged/persisted/echoed.
      - name: error
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Provider rejection; consume state and cancel flow; never echo diagnostics.
      - name: iss
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 2048
        description: If present, must exactly equal the stored expected issuer before code leaves this server.
      - name: error_description
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
        description: Bounded and discarded, never logged or returned.
      - name: error_uri
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 2048
        description: Bounded and discarded; never fetched or used as redirect.
      - name: session_state
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[!-~]+$
        description: Optional opaque OP session-management hint, bounded and discarded. Never authentication,
          authorization, logout evidence or a browser-storage value; no OP iframe/session-management support is implied.
      description: 'Top-level HTTPS GET; exact pending browser cookie, host origin, provider path and stored redirect/client/purpose/epoch/version
        must match before network. Cross-origin IdP navigation need not have Origin header: state/browser binding
        supplies CSRF protection. Reject duplicates, unknown keys, malformed code/error combinations and code without
        state. No application-level exchange retry: atomic issued→exchanging consumes state before the single bounded
        token request. Repeated/in-progress/finished callback never sends code again; stale/failed/unknown exchange
        requires explicit new flow. Final verified issuer/sub and exact approved AD link require bounded live AD proof collected outside the DB writer; proof TTL/head, all floors and source
        principal are rechecked in the final transaction. State result and pending_mfa transition commit atomically.
        mfaClaimMode=none never completes MFA or creates session/handoff. Lost browser response reads own GET flow
        only if the rotated cookie arrived; loss of that cookie requires an explicit new login/authorization, never
        recovery of plaintext binding or a repeated token exchange;
        process/network uncertainty cancels flow after deadline. Code/state/JWT/nonce/verifier absent from access/audit
        logs. Responses set no-store and Referrer-Policy:no-referrer; redirect is fixed same-origin auth UI with flow
        ID only.'
      responses:
        '303':
          description: Fixed same-origin /auth-ui/ flow continuation; no code, token, state or arbitrary return URI.
          headers:
            Location:
              schema:
                type: string
                pattern: ^/auth-ui/\?flow=[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
        default: *oidcpaths001
  /auth/v2/password-reset-requests:
