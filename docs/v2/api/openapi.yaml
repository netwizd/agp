          $ref: '#/components/schemas/Id'
        routeId:
          $ref: '#/components/schemas/Id'
        route:
          $ref: ../schemas/gateway.schema.json#/properties/spec/properties/routes/items
        waf:
          $ref: ../schemas/gateway.schema.json#/properties/spec/properties/waf
        requireMfa:
          type: boolean
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/CompilerProvenance'
      required:
      - gatewayId
      - routeId
      - route
      - waf
      - requireMfa
      - provenance
      additionalProperties: false
    CompilerNodeBundle:
      type: object
      properties:
        nodeId:
          $ref: '#/components/schemas/Id'
        capabilityDigest:
          $ref: '#/components/schemas/Digest'
        baseBundleDigest:
          $ref: '#/components/schemas/Digest'
        gatewayIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/CompilerEffectiveRoute'
        resolvedInputs:
          type: array
          items:
            $ref: '#/components/schemas/CompilerInput'
        secretVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/CompilerArtifact'
        bundleDigest:
          $ref: '#/components/schemas/Digest'
        deployable:
          const: false
      required:
      - nodeId
      - gatewayIds
      - routes
      - resolvedInputs
      - secretVersionIds
      - artifacts
      - bundleDigest
      - deployable
      additionalProperties: false
    CompilerResult:
      type: object
      properties:
        configDigest:
          $ref: '#/components/schemas/Digest'
        catalogDigest:
          $ref: '#/components/schemas/Digest'
        compilerDigest:
          $ref: '#/components/schemas/Digest'
        compilerVersion:
          type: string
          minLength: 1
          maxLength: 64
        capacityProfile:
          type: string
          enum:
          - pilot-500
          - fleet-10k
        previewDigest:
          $ref: '#/components/schemas/Digest'
        deployable:
          const: false
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/CompilerNodeBundle'
          maxItems: 500
        resolvedInputs:
          type: array
          items:
            $ref: '#/components/schemas/CompilerInput'
          maxItems: 50000
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationIssue'
          maxItems: 100
      required:
      - configDigest
      - catalogDigest
      - compilerDigest
      - compilerVersion
      - capacityProfile
      - previewDigest
      - deployable
      - bundles
      - resolvedInputs
      - issues
      additionalProperties: false
      description: Full per-node proposals only. compilerDigest pins version/options including the SHA-256 digest
        of the actual binary; operator-declared inputs never make this output deployable. Aggregate response byte
        budget is enforced separately.
    ValidationReport:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        targetKind:
          type: string
          enum:
          - draft
          - revision
        targetId:
          $ref: '#/components/schemas/Id'
        targetRevision:
          $ref: '#/components/schemas/UInt63'
        configDigest:
          $ref: '#/components/schemas/Digest'
        catalogSnapshotId:
          $ref: '#/components/schemas/Id'
        catalogDigest:
          $ref: '#/components/schemas/Digest'
        compilerDigest:
          $ref: '#/components/schemas/Digest'
        authoringValid:
          type: boolean
        deployable:
          const: false
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationIssue'
          maxItems: 100
        diff:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationChange'
        preview:
          $ref: '#/components/schemas/CompilerResult'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - targetKind
      - targetId
      - targetRevision
      - configDigest
      - compilerDigest
      - authoringValid
      - deployable
      - issues
      - diff
      - createdAt
      additionalProperties: false
      description: Immutable S1 report for the exact draft/revision version. authoringValid may be true while deployable
        remains false. Catalog and preview are absent when no catalog is available. Operation success means report
        generation, not approval or apply.
    ConfigurationSiteAccess:
      type: object
      properties:
        siteId:
          $ref: '#/components/schemas/Id'
        read:
          type: boolean
        edit:
          type: boolean
        approve:
          type: boolean
          description: Optional; omitted when false. Explicit current config.approve scope, not an admin compatibility
            or draft-review grant.
      required:
      - siteId
      - read
      - edit
      additionalProperties: false
    ConfigurationAccess:
      type: object
      properties:
        principalId:
          $ref: '#/components/schemas/Id'
        globalRead:
          type: boolean
        globalEdit:
          type: boolean
        gatewayRead:
          type: boolean
          description: Object workflow admission only. Each Gateway is separately authorized; no Site or global authority is inferred.
        gatewayEdit:
          type: boolean
          description: Object edit workflow admission only; the response for each Gateway supplies exact current edit access.
        resourceRead:
          type: boolean
          description: Resource workflow admission only; every placement is separately authorized.
        resourceEdit:
          type: boolean
          description: Resource edit workflow admission only; current resourceAccess and full routing effects are checked on save.
        authorityEpoch:
          $ref: '#/components/schemas/UInt63'
        sites:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationSiteAccess'
        globalApprove:
          type: boolean
          description: Optional; omitted when false. Requires an explicit current global config.approve grant.
      required:
      - principalId
      - globalRead
      - globalEdit
      - authorityEpoch
      - sites
      additionalProperties: false
      description: Current epoch-bound authoring access. Admin compatibility grants read/edit only; no implicit
        config.approve. Optional globalApprove/sites.approve expose explicit grants and are omitted when false.
        Site ownership comes from the bootstrap DB projection, never from imported catalogs.
    ZoneAuthoringSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        baseRevisionId:
          $ref: '#/components/schemas/Id'
        zoneId:
          $ref: '#/components/schemas/Id'
        siteId:
          $ref: '#/components/schemas/Id'
        ownerId:
          $ref: '#/components/schemas/Id'
        contentDigest:
          $ref: '#/components/schemas/Digest'
        state:
          const: draft
        revision:
          $ref: '#/components/schemas/UInt63'
      required:
      - id
      - zoneId
      - siteId
      - ownerId
      - contentDigest
      - state
      - revision
      additionalProperties: false
      description: S1b pilot authoring head only. id is the immutable zone revision ID; zoneId is the stable authored
        identity. No content, desired state, deployed state or membership counters. This is not WafZoneSummary.
    ZoneAuthoringPin:
      type: object
      properties:
        zoneRevisionId:
          $ref: '#/components/schemas/Id'
        zoneId:
          $ref: '#/components/schemas/Id'
        contentDigest:
          $ref: '#/components/schemas/Digest'
      required:
      - zoneRevisionId
      - zoneId
      - contentDigest
      additionalProperties: false
    ZoneAuthoringPreviewRequest:
      type: object
      properties:
        baseRevisionId:
          $ref: '#/components/schemas/Id'
        catalogSnapshotId:
          $ref: '#/components/schemas/Id'
        capacityProfile:
          enum:
          - pilot-500
          - fleet-10k
        action:
          enum:
          - reconcile
          - retire
        replacementAssignments:
          type: array
          items:
            type: object
            properties:
              gatewayId:
                $ref: '#/components/schemas/Id'
              zoneRevisionId:
                $ref: '#/components/schemas/Id'
            required:
            - gatewayId
            - zoneRevisionId
            additionalProperties: false
          maxItems: 10000
      required:
      - baseRevisionId
      - catalogSnapshotId
      - capacityProfile
      - action
      additionalProperties: false
    ZoneAuthoringPreview:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          const: authoring_preview
        authorId:
          $ref: '#/components/schemas/Id'
        zoneRevisionId:
          $ref: '#/components/schemas/Id'
        siteId:
          $ref: '#/components/schemas/Id'
        baseRevisionId:
          $ref: '#/components/schemas/Id'
        configDigest:
          $ref: '#/components/schemas/Digest'
        catalogSnapshotId:
          $ref: '#/components/schemas/Id'
        catalogDigest:
          $ref: '#/components/schemas/Digest'
        resolverDigest:
          $ref: '#/components/schemas/Digest'
        inventoryDigest:
          $ref: '#/components/schemas/Digest'
        headsDigest:
          $ref: '#/components/schemas/Digest'
        previewDigest:
          $ref: '#/components/schemas/Digest'
        capacityProfile:
          enum:
          - pilot-500
          - fleet-10k
        action:
          enum:
          - reconcile
          - retire
        assignmentSource:
          const: hypothetical_authoring_membership
        authoringValid:
          type: boolean
        deployable:
          const: false
        pins:
          type: array
          items:
            $ref: '#/components/schemas/ZoneAuthoringPin'
          maxItems: 2000
        members:
          type: array
          items:
            $ref: ../schemas/waf-zone-resolution.schema.json#/$defs/Member
          maxItems: 10000
        conflicts:
          type: array
          items:
            $ref: ../schemas/waf-zone-resolution.schema.json#/$defs/Conflict
          maxItems: 10000
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationIssue'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - purpose
      - authorId
      - zoneRevisionId
      - siteId
      - baseRevisionId
      - configDigest
      - catalogSnapshotId
      - catalogDigest
      - resolverDigest
      - inventoryDigest
      - headsDigest
      - previewDigest
      - capacityProfile
      - action
      - assignmentSource
      - authoringValid
      - deployable
      - pins
      - members
      - conflicts
      - issues
      - createdAt
      - expiresAt
      additionalProperties: false
      description: Frozen S1b hypothetical authoring proposal, not WafZoneResolution. TTL is 30 minutes; previewDigest
        includes purpose, qualification boundary, exact inputs, pins and expiry. Member fields reuse only structural
        definitions; their assignment provenance is hypothetical. No resolutionDigest or native publication evidence
        is issued. Immutable report retrieval does not renew expiry or establish current review eligibility.
    ZoneAuthoringReviewRequest:
      type: object
      properties:
        previewDigest:
          $ref: '#/components/schemas/Digest'
        reason:
          type: string
          minLength: 8
          maxLength: 1024
          description: At least 8 Unicode code points after trimming; at most 1024 Unicode code points and 4096
            UTF-8 bytes.
      required:
      - previewDigest
      - reason
      additionalProperties: false
    ZoneAuthoringReview:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          const: draft_review
        previewId:
          $ref: '#/components/schemas/Id'
        previewDigest:
          $ref: '#/components/schemas/Digest'
        authorId:
          $ref: '#/components/schemas/Id'
        reviewerId:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
        status:
          enum:
          - current
          - stale
      required:
      - id
      - purpose
      - previewId
      - previewDigest
      - authorId
      - reviewerId
      - createdAt
      - expiresAt
      - status
      additionalProperties: false
      description: Independent authoring feedback, never config.approve or a publication/apply permit. Reviewer
        differs from both zone author and preview creator, has current Site edit and fresh MFA. Expiry equals the
        preview expiry. Reads recompute stale from current epoch, author/reviewer security/grant fingerprints and
        exact head/co-zone/catalog/resolver inputs.
    ComponentProfile:
      $ref: ../schemas/component-profile.schema.json
    QualificationEvidence:
      $ref: ../schemas/qualification-evidence.schema.json
    DependencyClosure:
      $ref: ../schemas/dependency-closure.schema.json
    SBOM:
      $ref: ../schemas/sbom.schema.json
    WAFQualification:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        contentDigest:
          $ref: '#/components/schemas/Digest'
        rulesetVersionId:
          $ref: '#/components/schemas/Id'
        rulesetDigest:
          $ref: '#/components/schemas/Digest'
        profileId:
          $ref: '#/components/schemas/Id'
        profileDigest:
          $ref: '#/components/schemas/Digest'
        tupleDigest:
          $ref: '#/components/schemas/Digest'
        evidenceDigest:
          $ref: '#/components/schemas/Digest'
        manifestDigest:
          $ref: '#/components/schemas/Digest'
        releaseSequence:
          $ref: '#/components/schemas/UInt63'
        compilerDigest:
          $ref: '#/components/schemas/Digest'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - contentDigest
      - rulesetVersionId
      - rulesetDigest
      - profileId
      - profileDigest
      - tupleDigest
      - evidenceDigest
      - manifestDigest
      - releaseSequence
      - compilerDigest
      - expiresAt
      additionalProperties: false
      description: Exact provider proof pins. Current rechecks fresh signed journal time, independent repository
        metadata/security floors, manifest digest and release sequence, exact component/evidence/ruleset/compiler
        pins and expiry. Same-profile/evidence replacement by another release invalidates the old proof.
    WafPolicyValidation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        policyRevisionId:
          $ref: '#/components/schemas/Id'
        contentDigest:
          $ref: '#/components/schemas/Digest'
        qualification:
          $ref: '#/components/schemas/WAFQualification'
        qualificationDigest:
          $ref: '#/components/schemas/Digest'
        valid:
          type: boolean
        current:
          type: boolean
        deployable:
          const: false
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationIssue'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - policyRevisionId
      - contentDigest
      - qualification
      - qualificationDigest
      - valid
      - current
      - deployable
      - issues
      - createdAt
      - expiresAt
      additionalProperties: false
      description: Immutable validation fact with a dynamically recomputed current flag. Valid native policy syntax
        and publication do not authorize a deployment. current becomes false after head/author-rights/epoch/release-floor/pin/expiry
        drift or loss of current provider trust. qualification is non-null for stored reports returned by this endpoint.
    AgentInventoryView:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        siteId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 128
        labels:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_.-]{0,62}$
          additionalProperties:
            type: string
            minLength: 0
            maxLength: 128
        groupIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        connectivity:
          type: string
          enum:
          - unknown
          - online
          - offline
        identityState:
          type: string
          enum:
          - active
          - expired
          - revoked
        capabilityDigest:
          $ref: '#/components/schemas/Digest'
        lastSeenAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - siteId
      - name
      - labels
      - groupIds
      - connectivity
      - identityState
      additionalProperties: false
      description: Read-only admin projection. Online means a current authenticated receipt, not health or applied protection.
        LastSeenAt/capabilityDigest are omitted when no usable current receipt exists.
    AgentInventoryOS:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        versionId:
          type: string
          minLength: 1
          maxLength: 64
        kernel:
          type: string
          minLength: 1
          maxLength: 128
        architecture:
          type: string
          enum:
          - amd64
          - arm64
      required:
      - id
      - versionId
      - kernel
      - architecture
      additionalProperties: false
    AgentInventoryFile:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
        digest:
          $ref: '#/components/schemas/Digest'
      required:
      - path
      - digest
      additionalProperties: false
      description: Relative canonical path; runtime rejects absolute, dot traversal, backslash and control characters.
        Paths must be unique in component files.
    AgentInventoryComponent:
      type: object
      properties:
        profileDigest:
          $ref: '#/components/schemas/Digest'
        files:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AgentInventoryFile'
      required:
      - profileDigest
      - files
      additionalProperties: false
      description: Digest of exact public component-profile bytes and observed file hashes. Consuming server must match
        current signed profile/evidence and platform; client claims alone are not qualification.
    AgentInventoryCapabilities:
      type: object
      properties:
        agentVersion:
          type: string
          minLength: 1
          maxLength: 64
        protocolVersion:
          const: agp.agent/v1alpha1
        os:
          $ref: '#/components/schemas/AgentInventoryOS'
        component:
          $ref: '#/components/schemas/AgentInventoryComponent'
      required:
      - agentVersion
      - protocolVersion
      - os
      additionalProperties: false
      description: Immutable JCS capability facts; byte bounds and control-character checks also apply in runtime. Component
        may be omitted. Boot/free-space/receipt time are excluded from capabilityDigest.
    AgentInventoryObservation:
      type: object
      properties:
        bootId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        freeBytes:
          $ref: '#/components/schemas/UInt63'
        capabilities:
          $ref: '#/components/schemas/AgentInventoryCapabilities'
      required:
      - bootId
      - freeBytes
      - capabilities
      additionalProperties: false
    AgentInventorySubmission:
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/Id'
        challengeId:
          $ref: '#/components/schemas/Id'
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        observation:
          $ref: '#/components/schemas/AgentInventoryObservation'
      required:
      - requestId
      - challengeId
      - challenge
      - observation
      additionalProperties: false
    AgentInventoryChallenge:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - challenge
      - expiresAt
      additionalProperties: false
    AgentInventoryReceipt:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sequence:
          allOf:
          - $ref: '#/components/schemas/UInt63'
          description: Positive per-node monotonic receipt sequence; runtime rejects zero.
        requestId:
          $ref: '#/components/schemas/Id'
        nodeId:
          $ref: '#/components/schemas/Id'
        capabilityDigest:
          $ref: '#/components/schemas/Digest'
        observationDigest:
          $ref: '#/components/schemas/Digest'
        receivedAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - sequence
      - requestId
      - nodeId
      - capabilityDigest
      - observationDigest
      - receivedAt
      - expiresAt
      additionalProperties: false
      description: Immutable receipt. ExpiresAt = receivedAt + 120 seconds. Replaying an exact accepted Submission never
        refreshes these times.
    WafZoneValidation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        zoneRevisionId:
          $ref: '#/components/schemas/Id'
        contentDigest:
          $ref: '#/components/schemas/Digest'
        policyRevisionId:
          $ref: '#/components/schemas/Id'
        policyPublicationId:
          $ref: '#/components/schemas/Id'
        qualification:
          $ref: '#/components/schemas/WAFQualification'
        dependencyDigest:
          $ref: '#/components/schemas/Digest'
        valid:
          type: boolean
        current:
          type: boolean
        deployable:
          const: false
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ConfigurationIssue'
        createdAt:
          $ref: '#/components/schemas/UtcTime'
        expiresAt:
          $ref: '#/components/schemas/UtcTime'
      required:
      - id
      - zoneRevisionId
      - contentDigest
      - policyRevisionId
      - policyPublicationId
      - qualification
      - dependencyDigest
      - valid
      - current
      - deployable
      - issues
      - createdAt
      - expiresAt
      additionalProperties: false
      description: Zone head/author rights/epoch, exact published same-Site base policy, owner and native qualification
        pins are checked dynamically. At most 30-minute validity, bounded by provider proof expiry. Publication is a
        separate historical fact and does not authorize apply.
    SignedPlan:
      $ref: ../schemas/signed-plan.schema.json
    PlanProposal:
      $ref: ../schemas/plan-proposal.schema.json
    PlanProposalReview:
      $ref: ../schemas/plan-proposal.schema.json#/$defs/Review
    SignedPlanReview:
      $ref: ../schemas/signed-plan-review.schema.json
    PlanProposalView:
      type: object
      properties:
        proposal:
          $ref: '#/components/schemas/PlanProposal'
        current:
          type: boolean
      required:
      - proposal
      - current
      additionalProperties: false
    PlanProposalPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlanProposalView'
          minItems: 0
          maxItems: 50
        nextCursor:
          $ref: '#/components/schemas/Id'
      required:
      - items
      additionalProperties: false
  securitySchemes:
    ManagementSession:
      type: apiKey
      in: cookie
      name: __Host-agp_mgmt
    NodeMTLS:
      type: mutualTLS
    PendingFlow:
      type: apiKey
      in: cookie
      name: __Host-agp_flow
      description: Limited host-only pending transaction credential, never an authenticated session. Browser Origin/CSRF
        and flow/audience binding are required.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^"[0-9]+"$
      description: ETag последней прочитанной mutable resource revision; mismatch=412.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      description: Scoped to actor+route; same key with different canonical body=409.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
      description: Synchronizer token for management session; enforce exact Origin too.
security:
- ManagementSession: []
